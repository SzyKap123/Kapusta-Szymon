<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#060a13">
<!--ARTIFACT-START-->
<title>Strefa Zero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Kokpit sci-fi: pełnoekranowa gra, szklane panele ze ściętymi rogami */
:root {
  --void: #060a13;
  --panel: rgba(10, 18, 34, .88);
  --panel2: rgba(20, 34, 60, .9);
  --line: rgba(110, 200, 255, .28);
  --cyan: #3ef0ff;
  --amber: #ffb627;
  --rose: #ff4d6d;
  --lime: #8dff6a;
  --text: #e8f2ff;
  --dim: #8ea3c4;
  --display: 'Russo One', 'Arial Black', Impact, sans-serif;
  --ui: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  --cut: 12px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--void); color: var(--text);
  font-family: var(--ui); font-weight: 600;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#probe { position: fixed; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
button { font: inherit; color: inherit; }

.screen {
  position: fixed; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center;
  gap: clamp(6px, 2vh, 16px);
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(180deg, rgba(6,10,19,.55), rgba(6,10,19,.82));
  overflow-y: auto;
}
.screen.overlay { justify-content: center; background: rgba(4,7,14,.78); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
.cutbox { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }

/* ---- Menu główne ---- */
.menu { justify-content: center; align-items: flex-start; background: linear-gradient(90deg, rgba(6,10,19,.92) 0%, rgba(6,10,19,.6) 45%, rgba(6,10,19,0) 75%); }
.menuMain { display: flex; flex-direction: column; gap: clamp(8px, 2.4vh, 18px); padding-left: clamp(0px, 4vw, 60px); max-width: 100%; }
.kicker { margin: 0; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--cyan); }
.logo { margin: 0; font-family: var(--display); font-weight: 400; line-height: .86; font-size: clamp(46px, 17vh, 120px); letter-spacing: .02em;
  background: linear-gradient(180deg, #ffffff 0%, #bfe9ff 55%, #5fb8ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 rgba(0,0,0,.5)) drop-shadow(0 0 22px rgba(62,240,255,.35)); }
.logo span { display: block; background: linear-gradient(180deg, #ffe08a, #ffb627 60%, #ff7a2e); -webkit-background-clip: text; background-clip: text; }
.menuBtns { display: flex; flex-direction: column; gap: 10px; width: min(300px, 80vw); }
.coins { display: inline-flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 20px; color: #ffe08a; font-variant-numeric: tabular-nums;
  padding: 6px 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.coin { width: 18px; height: 18px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff6c4, #ffc93c 45%, #b8741a); box-shadow: 0 0 10px rgba(255,190,60,.6); display: inline-block; }
.topRight { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }

.btn {
  --bg: var(--panel2);
  position: relative; cursor: pointer; border: 0;
  font-family: var(--display); font-size: clamp(16px, 4.6vh, 22px); letter-spacing: .06em; text-transform: uppercase;
  padding: .62em 1.2em; color: var(--text); background: var(--bg);
  box-shadow: inset 0 0 0 1px var(--line), inset 0 -3px 0 rgba(0,0,0,.35);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  transition: transform .08s ease, filter .12s ease;
  text-align: left;
}
.btn:hover { filter: brightness(1.18); }
.btn:active { transform: translateY(2px) scale(.99); }
.btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
.btn.primary { --bg: linear-gradient(180deg, #ffd25a, #ffb627 55%, #f08a12); color: #1a1004; box-shadow: inset 0 -3px 0 rgba(120,50,0,.45), 0 0 24px rgba(255,182,39,.3); }
.btn.ghost { --bg: rgba(10,18,34,.5); }
.btn.small { font-size: 14px; padding: .5em .9em; }
.btn[disabled] { opacity: .45; cursor: default; filter: grayscale(.6); }

/* ---- Nagłówki ekranów ---- */
.head { width: 100%; max-width: 1100px; display: flex; align-items: center; gap: 12px; flex: 0 0 auto; }
.head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(20px, 5.5vh, 30px); letter-spacing: .04em; flex: 1; min-width: 0; text-transform: uppercase; }
.back { width: 44px; height: 40px; padding: 0; display: grid; place-items: center; text-align: center; }
.back svg { width: 22px; height: 22px; }
.body { width: 100%; max-width: 1100px; flex: 1 1 auto; min-height: 0; }

/* ---- Wybór misji ---- */
.biomes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(8px, 1.6vw, 16px); }
.biome { position: relative; min-width: 0; padding: 12px 12px 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
.biome::before { content: ''; position: absolute; inset: 0; background: var(--bg); opacity: .55; pointer-events: none; }
.biome > * { position: relative; }
.biome h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(15px, 4vh, 21px); letter-spacing: .03em; color: var(--acc); text-transform: uppercase; line-height: 1.05; }
.biome p { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.3; }
.nodes { margin-top: auto; display: flex; gap: 8px; justify-content: space-between; }
.node { flex: 1; min-width: 0; aspect-ratio: 1 / 1.05; max-width: 100%; cursor: pointer; border: 0; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  background: linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.02)); box-shadow: inset 0 0 0 1px var(--line);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); transition: transform .1s ease, background .1s ease; }
.node:hover:not([disabled]) { background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.05)); }
.node:active:not([disabled]) { transform: scale(.96); }
.node:focus-visible { outline: 2px solid var(--cyan); }
.node b { font-family: var(--display); font-weight: 400; font-size: clamp(18px, 5vh, 26px); line-height: 1; }
.node.boss b { color: var(--rose); font-size: clamp(12px, 3.2vh, 15px); letter-spacing: .06em; }
.node.cur { background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 45%, transparent), rgba(255,255,255,.04)); }
.node[disabled] { cursor: default; opacity: .4; }
.node svg.lock { width: 18px; height: 18px; }
.stars { display: flex; gap: 1px; }
.stars svg { width: 11px; height: 11px; }

/* ---- Zbrojownia ---- */
.shop { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; height: 100%; }
.col { min-width: 0; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
.col h3 { margin: 0; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--cyan); }
.list { display: flex; flex-direction: column; gap: 6px; overflow-y: auto; min-height: 0; padding-right: 2px; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.item.own { box-shadow: inset 0 0 0 1px rgba(141,255,106,.4); }
.item canvas { width: 72px; height: 36px; }
.item .ic { width: 36px; height: 36px; display: grid; place-items: center; color: var(--amber); background: rgba(255,182,39,.1); }
.item .ic svg { width: 22px; height: 22px; }
.item h4 { margin: 0; font-size: 15px; font-weight: 700; line-height: 1.1; }
.item p { margin: 2px 0 0; font-size: 11px; color: var(--dim); line-height: 1.25; }
.pips { display: flex; gap: 3px; margin-top: 4px; }
.pips i { width: 12px; height: 4px; background: rgba(255,255,255,.15); }
.pips i.on { background: var(--amber); box-shadow: 0 0 6px rgba(255,182,39,.7); }
.price { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.price .coin { width: 13px; height: 13px; }
.tag { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--lime); }

/* ---- Ustawienia ---- */
.settings { display: flex; flex-direction: column; gap: 8px; width: min(560px, 100%); margin: 0 auto; }
.setRow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.setRow span { font-size: 15px; }
.setRow small { display: block; color: var(--dim); font-size: 11px; font-weight: 500; }
.toggle { min-width: 92px; text-align: center; }
.toggle.on { --bg: linear-gradient(180deg, #4ff6ff, #18b7d6); color: #021820; }

/* ---- Awans / Pauza / Wynik ---- */
.ovTitle { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(26px, 8vh, 46px); letter-spacing: .04em; text-transform: uppercase; text-align: center;
  color: #fff; text-shadow: 0 0 24px rgba(62,240,255,.55); }
.perks { display: flex; gap: clamp(8px, 1.6vw, 16px); justify-content: center; flex-wrap: wrap; max-width: 100%; }
.perk { width: clamp(150px, 26vw, 230px); min-width: 0; cursor: pointer; border: 0; padding: 14px 12px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  background: linear-gradient(180deg, rgba(40,70,120,.85), rgba(12,22,42,.92)); box-shadow: inset 0 0 0 1px var(--line), 0 0 30px rgba(62,240,255,.08);
  clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
  animation: rise .35s ease both; transition: transform .1s ease, filter .1s ease; }
.perk:nth-child(2) { animation-delay: .06s; } .perk:nth-child(3) { animation-delay: .12s; }
.perk:hover { filter: brightness(1.2); transform: translateY(-3px); }
.perk:focus-visible { outline: 2px solid var(--cyan); }
.perk .pic { width: 52px; height: 52px; display: grid; place-items: center; color: var(--c, var(--cyan));
  background: radial-gradient(circle, color-mix(in srgb, var(--c, #3ef0ff) 35%, transparent), transparent 70%); }
.perk .pic svg { width: 32px; height: 32px; filter: drop-shadow(0 0 6px currentColor); }
.perk h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: .03em; }
.perk p { margin: 0; font-size: 12px; color: #c4d4ee; line-height: 1.3; }
.perk .lv { font-size: 10px; letter-spacing: .18em; color: var(--amber); text-transform: uppercase; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.row .btn { text-align: center; }
.resStars { display: flex; gap: 8px; }
.resStars svg { width: clamp(30px, 9vh, 48px); height: clamp(30px, 9vh, 48px); animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; }
.resStars svg:nth-child(2) { animation-delay: .15s; } .resStars svg:nth-child(3) { animation-delay: .3s; }
@keyframes pop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }
.resStats { display: flex; gap: clamp(14px, 4vw, 34px); flex-wrap: wrap; justify-content: center; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; text-align: center; }
.resStats b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(18px, 5vh, 26px); color: var(--text); letter-spacing: .02em; }
.perkMini { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 600px; }
.perkMini span { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; font-size: 12px; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.perkMini svg { width: 14px; height: 14px; color: var(--cyan); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

#sRotate { display: none; z-index: 30; justify-content: center; background: var(--void); text-align: center; }
#sRotate .phone { width: 50px; height: 86px; border: 4px solid var(--cyan); border-radius: 10px; box-shadow: 0 0 20px rgba(62,240,255,.5); animation: turn 1.8s ease-in-out infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #sRotate { display: flex; } }
@media (max-width: 640px) { .shop { grid-template-columns: minmax(0, 1fr); height: auto; } .biome p { display: none; } }
@media (max-height: 380px) { .biome p { display: none; } .menuBtns .btn { padding: .48em 1.1em; } }
@media (prefers-reduced-motion: reduce) { .perk, .resStars svg, #sRotate .phone { animation: none; } .btn, .node, .perk { transition: none; } }
</style>
</head>
<body>
<!--ARTIFACT-BODY-->
<canvas id="game"></canvas>
<div id="probe"></div>

<section id="sMenu" class="screen menu">
  <div class="topRight"><span class="coins"><i class="coin"></i><span id="mCoins">0</span></span></div>
  <div class="menuMain">
    <p class="kicker">Operacja przetrwania · 9 misji · 3 bossów</p>
    <h1 class="logo">Strefa<span>Zero</span></h1>
    <div class="menuBtns">
      <button id="bPlay" class="btn primary" type="button">Misje</button>
      <button id="bShop" class="btn" type="button">Zbrojownia</button>
      <button id="bSet" class="btn ghost" type="button">Ustawienia</button>
    </div>
  </div>
</section>

<section id="sLevels" class="screen" hidden>
  <div class="head">
    <button class="btn ghost back" data-back type="button" aria-label="Wróć"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>Wybierz misję</h2>
    <span class="coins"><i class="coin"></i><span class="coinVal">0</span></span>
  </div>
  <div class="body"><div class="biomes" id="biomes"></div></div>
</section>

<section id="sShop" class="screen" hidden>
  <div class="head">
    <button class="btn ghost back" data-back type="button" aria-label="Wróć"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>Zbrojownia</h2>
    <span class="coins"><i class="coin"></i><span class="coinVal">0</span></span>
  </div>
  <div class="body shop">
    <div class="col"><h3>Broń · zabierasz wszystkie kupione</h3><div class="list" id="wList"></div></div>
    <div class="col"><h3>Ulepszenia na stałe</h3><div class="list" id="uList"></div></div>
  </div>
</section>

<section id="sSet" class="screen" hidden>
  <div class="head">
    <button class="btn ghost back" data-back type="button" aria-label="Wróć"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h2>Ustawienia</h2>
  </div>
  <div class="body"><div class="settings" id="setList"></div></div>
</section>

<section id="sLvlUp" class="screen overlay" hidden>
  <p class="kicker" id="luKick">Awans</p>
  <h2 class="ovTitle" id="luTitle">Poziom 2</h2>
  <div class="perks" id="perks"></div>
</section>

<section id="sPause" class="screen overlay" hidden>
  <h2 class="ovTitle">Pauza</h2>
  <div class="perkMini" id="pausePerks"></div>
  <div class="row">
    <button id="bResume" class="btn primary" type="button">Wznów</button>
    <button id="bRestart" class="btn" type="button">Od nowa</button>
    <button id="bQuit" class="btn ghost" type="button">Wyjdź z misji</button>
  </div>
</section>

<section id="sResult" class="screen overlay" hidden>
  <p class="kicker" id="rKick">Misja 1</p>
  <h2 class="ovTitle" id="rTitle">Misja ukończona</h2>
  <div class="resStars" id="rStars"></div>
  <div class="resStats" id="rStats"></div>
  <div class="row" id="rBtns"></div>
</section>

<section id="sRotate" class="screen">
  <div class="phone"></div>
  <h2 class="ovTitle">Obróć telefon</h2>
  <p class="kicker">Strefa Zero działa tylko w poziomie</p>
</section>

<script src="js/1-core.js"></script>
<script src="js/2-gfx.js"></script>
<script src="js/2b-map.js"></script>
<script src="js/2c-chars.js"></script>
<script src="js/3-game.js"></script>
<script src="js/3b-enemies.js"></script>
<script src="js/3c-update.js"></script>
<script src="js/4-render.js"></script>
<script src="js/4b-hud.js"></script>
<script src="js/5-ui.js"></script>
<!--ARTIFACT-END-->
</body>
</html>
