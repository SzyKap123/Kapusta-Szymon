<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1236">
<!--ARTIFACT-START-->
<title>Arena Kapusty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
/* Jeden świat arcade: pełnoekranowe płótno gry, nakładki menu na środku */
:root {
  --night: #1b1236;
  --ink: #140c2a;
  --sun: #ffc93c;
  --leaf: #4fd16b;
  --hot: #ff4f6d;
  --paper: #fff7e6;
  --muted: #b9a9e0;
  --display: 'Lilita One', 'Arial Black', Impact, sans-serif;
  --body: 'Nunito', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
html, body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--night); color: var(--paper);
  font-family: var(--body);
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#probe { position: fixed; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }

.screen {
  position: fixed; inset: 0; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(8px, 2.6vh, 22px);
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse at 50% 40%, rgba(27,18,54,.55), rgba(20,12,42,.92) 75%);
  text-align: center; overflow-y: auto;
}
.logo {
  margin: 0; font-family: var(--display); font-weight: 400;
  font-size: clamp(30px, 9vh, 72px); line-height: .95; letter-spacing: .01em;
  color: var(--sun);
  -webkit-text-stroke: 2px var(--ink);
  text-shadow: 0 4px 0 var(--ink), 0 7px 0 rgba(0,0,0,.35);
  transform: rotate(-2deg);
  text-wrap: balance;
}
.logo span { color: var(--paper); }
.tag { margin: 0; font-weight: 900; font-size: clamp(12px, 2.8vh, 16px); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }

.cards { display: flex; gap: clamp(8px, 2vw, 18px); flex-wrap: wrap; justify-content: center; max-width: 100%; }
.card {
  position: relative; width: clamp(130px, 22vw, 200px); min-width: 0;
  padding: 8px 10px 10px; border-radius: 16px;
  background: #2a1d52; border: 3px solid var(--ink);
  box-shadow: 0 5px 0 var(--ink);
  color: var(--paper); font: inherit; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: transform .12s ease, background .12s ease;
}
.card:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.card.sel { background: #3e2a7a; transform: translateY(-4px); box-shadow: 0 9px 0 var(--ink), 0 0 0 3px var(--sun) inset; }
.card canvas { width: clamp(54px, 15vh, 92px); height: clamp(54px, 15vh, 92px); }
.card h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(18px, 4.4vh, 26px); line-height: 1; }
.card .role { font-size: 11px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.card p { margin: 0; font-size: 12px; line-height: 1.25; font-weight: 700; color: #ddd2f5; }
.bars { width: 100%; display: grid; grid-template-columns: auto 1fr; gap: 3px 6px; align-items: center; font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.bar { height: 6px; border-radius: 3px; background: #170f30; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); border-radius: 3px; }

.btn {
  font-family: var(--display); font-size: clamp(22px, 6vh, 34px); line-height: 1;
  padding: .32em 1.4em .38em; border-radius: 14px; cursor: pointer;
  color: var(--ink); background: var(--sun);
  border: 3px solid var(--ink); box-shadow: 0 6px 0 var(--ink);
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--paper); outline-offset: 3px; }
.btn.alt { background: var(--paper); font-size: clamp(16px, 4.4vh, 22px); }
.row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.hint { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); max-width: 60ch; line-height: 1.35; }
.hint b { color: var(--paper); }

.rank { font-family: var(--display); font-size: clamp(60px, 22vh, 150px); line-height: .9; margin: 0;
  -webkit-text-stroke: 3px var(--ink); text-shadow: 0 6px 0 var(--ink); color: var(--paper); }
.rank.win { color: var(--sun); }
.verdict { margin: 0; font-family: var(--display); font-size: clamp(22px, 6vh, 38px); color: var(--paper); text-shadow: 0 3px 0 var(--ink); }
.stats { display: flex; gap: 20px; font-weight: 900; color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.stats b { display: block; font-family: var(--display); font-size: 26px; color: var(--paper); letter-spacing: 0; font-weight: 400; }

#rotate { display: none; z-index: 20; background: var(--night); }
#rotate .phone { width: 54px; height: 90px; border: 5px solid var(--sun); border-radius: 12px; animation: turn 1.8s ease-in-out infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
@media (prefers-reduced-motion: reduce) { #rotate .phone { animation: none; transform: rotate(-90deg); } .card, .btn { transition: none; } }
@media (max-height: 360px) { .card p { display: none; } }
</style>
</head>
<body>
<!--ARTIFACT-BODY-->
<canvas id="game"></canvas>
<div id="probe"></div>

<section id="menu" class="screen">
  <h1 class="logo">Arena <span>Kapusty</span></h1>
  <p class="tag">Bitwa do ostatniego · 6 graczy · trujący gaz</p>
  <div class="cards" id="cards"></div>
  <button class="btn" id="playBtn" type="button">GRAJ!</button>
  <p class="hint" id="bestLine"><b>Lewy kciuk</b> – ruch · <b>prawy kciuk</b> – przeciągnij i puść, by strzelić (stuknięcie = auto-celowanie) · <b>żółty przycisk</b> – super</p>
</section>

<section id="end" class="screen" hidden>
  <p class="rank" id="rankNum">#1</p>
  <p class="verdict" id="verdict">Zwycięstwo!</p>
  <div class="stats">
    <div><b id="stKills">0</b>Eliminacje</div>
    <div><b id="stCubes">0</b>Kostki mocy</div>
    <div><b id="stTime">0:00</b>Czas</div>
  </div>
  <div class="row">
    <button class="btn" id="againBtn" type="button">Jeszcze raz</button>
    <button class="btn alt" id="menuBtn" type="button">Zmień zawodnika</button>
  </div>
</section>

<section id="rotate" class="screen">
  <div class="phone"></div>
  <p class="verdict">Obróć telefon poziomo</p>
  <p class="hint">Arena Kapusty działa tylko w poziomie.</p>
</section>

<script>
(() => {
'use strict';
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
const TAU = Math.PI * 2;
let W = 0, H = 0, DPR = 1;
const safe = { t: 0, r: 0, b: 0, l: 0 };
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  const cs = getComputedStyle(document.getElementById('probe'));
  safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
  safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
}
window.addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const store = {
  get(k, d) { try { const v = localStorage.getItem('arena_' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('arena_' + k, JSON.stringify(v)); } catch (e) {} }
};

// ---------- Zawodnicy ----------
const TYPES = {
  kapsel: { name: 'Kapsel', role: 'Śrutówka', desc: 'Miażdży z bliska. Super przebija ściany.',
    hp: 4400, speed: 255, range: 340, reload: 1.25, dmg: 330, superNeed: 5200, attack: 'shotgun',
    color: '#ff8a3d', dark: '#b8481a', stat: { hp: .9, rng: .4, dmg: .85 } },
  iskra: { name: 'Iskra', role: 'Snajperka', desc: 'Trafia z daleka. Super: 3 przebijające strzały.',
    hp: 3000, speed: 240, range: 720, reload: 1.55, dmg: 1150, superNeed: 3700, attack: 'sniper',
    color: '#41c8ff', dark: '#1a6fa3', stat: { hp: .5, rng: 1, dmg: .7 } },
  bum: { name: 'Bum', role: 'Bombiarz', desc: 'Rzuca bomby nad murami. Super burzy ściany.',
    hp: 3400, speed: 245, range: 500, reload: 1.7, dmg: 1050, superNeed: 3600, attack: 'bomb',
    color: '#b77bff', dark: '#6a3bb0', stat: { hp: .65, rng: .7, dmg: .75 } }
};
const TYPE_KEYS = Object.keys(TYPES);
const NAMES = ['Bolek', 'Zenek', 'Gienek', 'Mirek', 'Kaśka', 'Jola', 'Franek', 'Bożena', 'Heniek', 'Ziuta', 'Waldek', 'Grażka'];

// ---------- Mapa ----------
const T = 64, MW = 40, MH = 26, WW = MW * T, WH = MH * T;
let grid = new Uint8Array(MW * MH);
function tileAt(tx, ty) { if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return 1; return grid[ty * MW + tx]; }
function solidAt(x, y) { return tileAt(Math.floor(x / T), Math.floor(y / T)) === 1; }
function bushAt(x, y) { return tileAt(Math.floor(x / T), Math.floor(y / T)) === 2; }
function freeCircle(x, y, r) {
  const x0 = Math.floor((x - r) / T), x1 = Math.floor((x + r) / T), y0 = Math.floor((y - r) / T), y1 = Math.floor((y + r) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (tileAt(tx, ty) !== 1) continue;
    const nx = clamp(x, tx * T, tx * T + T), ny = clamp(y, ty * T, ty * T + T);
    if ((x - nx) ** 2 + (y - ny) ** 2 < r * r) return false;
  }
  return true;
}
function los(ax, ay, bx, by) {
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 18);
  for (let i = 1; i < n; i++) { const t = i / n; if (solidAt(ax + (bx - ax) * t, ay + (by - ay) * t)) return false; }
  return true;
}
function spawnPoints() {
  const pts = [];
  for (let i = 0; i < 6; i++) {
    const a = i * TAU / 6 + TAU / 12;
    pts.push({ x: WW / 2 + Math.cos(a) * WW * 0.38, y: WH / 2 + Math.sin(a) * WH * 0.36 });
  }
  return pts;
}
function genMap() {
  grid = new Uint8Array(MW * MH);
  const hw = MW / 2, hh = MH / 2, q = new Uint8Array(hw * hh);
  const put = (x, y, w, h, v) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && j >= 0 && i < hw && j < hh) q[j * hw + i] = v; };
  for (let k = 0; k < 8; k++) { const horiz = Math.random() < .5; put(ri(1, hw - 2), ri(1, hh - 2), horiz ? ri(2, 4) : 1, horiz ? 1 : ri(2, 3), 1); }
  for (let k = 0; k < 3; k++) { const x = ri(2, hw - 3), y = ri(2, hh - 3); put(x, y, 2, 1, 1); put(x, y, 1, 2, 1); }
  for (let k = 0; k < 6; k++) put(ri(0, hw - 3), ri(0, hh - 3), ri(2, 4), ri(2, 3), 2);
  for (let j = 0; j < hh; j++) for (let i = 0; i < hw; i++) {
    const v = q[j * hw + i];
    grid[j * MW + i] = v; grid[j * MW + (MW - 1 - i)] = v;
    grid[(MH - 1 - j) * MW + i] = v; grid[(MH - 1 - j) * MW + (MW - 1 - i)] = v;
  }
  // środek areny: mały plac z krzakami dookoła
  for (let j = hh - 2; j < hh + 2; j++) for (let i = hw - 2; i < hw + 2; i++) grid[j * MW + i] = 0;
  for (const p of spawnPoints()) {
    const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T);
    for (let j = ty - 2; j <= ty + 2; j++) for (let i = tx - 2; i <= tx + 2; i++) if (i >= 0 && j >= 0 && i < MW && j < MH) grid[j * MW + i] = 0;
  }
}

// ---------- Dźwięk ----------
let AC = null, noiseBuf = null;
function ensureAudio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function sfx(kind, x, y) {
  if (!AC || !G) return;
  if (x !== undefined && Math.hypot(x - cam.x, y - cam.y) > 900) return;
  const t = AC.currentTime, g = AC.createGain();
  g.connect(AC.destination);
  if (kind === 'boom' || kind === 'break') {
    const s = AC.createBufferSource(); s.buffer = noiseBuf;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(kind === 'boom' ? 900 : 1800, t); f.frequency.exponentialRampToValueAtTime(80, t + .4);
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(kind === 'boom' ? .35 : .18, t); g.gain.exponentialRampToValueAtTime(.001, t + .45);
    s.start(t); s.stop(t + .5);
    return;
  }
  const o = AC.createOscillator(); o.connect(g);
  const P = {
    shot: ['square', 420, 110, .06, .09], snipe: ['sawtooth', 900, 200, .06, .14], throw: ['triangle', 300, 600, .07, .15],
    hit: ['sine', 700, 380, .08, .07], pick: ['sine', 500, 1300, .1, .18], die: ['sawtooth', 300, 50, .1, .5], super: ['square', 200, 900, .07, .3]
  }[kind];
  if (!P) return;
  o.type = P[0]; o.frequency.setValueAtTime(P[1], t); o.frequency.exponentialRampToValueAtTime(P[2], t + P[4]);
  g.gain.setValueAtTime(P[3], t); g.gain.exponentialRampToValueAtTime(.001, t + P[4]);
  o.start(t); o.stop(t + P[4] + .02);
}

// ---------- Stan meczu ----------
let G = null;
const cam = { x: WW / 2, y: WH / 2, zoom: 1, shake: 0 };
function mkBrawler(type, x, y, isPlayer, name) {
  const t = TYPES[type];
  return {
    kind: 'brawler', type, x, y, r: 28, vx: 0, vy: 0, hp: t.hp, maxHp: t.hp, ammo: 3, superCh: 0, cubes: 0,
    aim: Math.atan2(WH / 2 - y, WW / 2 - x), isPlayer, name, dead: false, lastHurt: -9, lastShot: -9,
    reveal: 0, flash: 0, kick: 0, inBush: false, gasAcc: 0, kills: 0, walk: 0,
    ai: isPlayer ? null : { cool: rand(2.5, 3.5), think: 0, target: null, goal: null, goalT: 0, strafe: 1, strafeT: 0,
      side: Math.random() < .5 ? 1 : -1, stuckT: 0, lx: x, ly: y, box: null, aimErr: rand(.1, .22) }
  };
}
function newMatch(playerType) {
  genMap();
  const sp = spawnPoints().sort(() => Math.random() - .5);
  const names = NAMES.slice().sort(() => Math.random() - .5);
  G = { t: 0, brawlers: [], boxes: [], cubes: [], bullets: [], bombs: [], parts: [], rings: [], pops: [],
    gasR: Math.hypot(WW, WH) / 2 + 60, player: null, over: false, endAt: 0, rank: 0, banner: null, demo: !playerType };
  sp.forEach((p, i) => {
    const isP = !!playerType && i === 0;
    const b = mkBrawler(isP ? playerType : TYPE_KEYS[ri(0, 2)], p.x, p.y, isP, isP ? 'Ty' : names[i]);
    G.brawlers.push(b);
    if (isP) G.player = b;
  });
  // skrzynki z kostkami mocy
  let tries = 0;
  while (G.boxes.length < 10 && tries++ < 500) {
    const tx = ri(2, MW - 3), ty = ri(2, MH - 3);
    if (tileAt(tx, ty) === 1) continue;
    const x = tx * T + T / 2, y = ty * T + T / 2;
    if (sp.some(p => Math.hypot(p.x - x, p.y - y) < 260)) continue;
    if (G.boxes.some(b => Math.hypot(b.x - x, b.y - y) < 300)) continue;
    G.boxes.push({ kind: 'box', x, y, r: 30, hp: 3000, maxHp: 3000, flash: 0, dead: false });
  }
  G.banner = playerType ? { text: 'Przetrwaj do końca!', t: 2.4 } : null;
  if (G.player) { cam.x = G.player.x; cam.y = G.player.y; }
}
const alive = () => G.brawlers.filter(b => !b.dead);

// ---------- Walka ----------
function hiddenFrom(t, viewer) {
  return t.inBush && t.reveal <= 0 && Math.hypot(t.x - viewer.x, t.y - viewer.y) > 150;
}
function fire(e, ang, frac, isSuper) {
  if (e.dead) return false;
  if (isSuper) { if (e.superCh < 1) return false; e.superCh = 0; }
  else { if (e.ammo < 1) return false; e.ammo -= 1; }
  const t = TYPES[e.type], mult = 1 + .1 * e.cubes;
  e.aim = ang; e.reveal = 1; e.lastShot = G.t; e.kick = 1;
  const ox = e.x + Math.cos(ang) * (e.r + 4), oy = e.y + Math.sin(ang) * (e.r + 4);
  const bullet = (a, spd, range, dmg, r, extra) => G.bullets.push(Object.assign({
    x: ox, y: oy, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, d: 0, max: range, dmg: dmg * mult, r, owner: e,
    pierce: false, hits: null, breakWalls: false, knock: 0, color: t.color, sup: isSuper
  }, extra || {}));
  if (t.attack === 'shotgun') {
    const n = isSuper ? 11 : 5, spread = isSuper ? .8 : .5;
    for (let i = 0; i < n; i++) {
      const a = ang - spread / 2 + spread * i / (n - 1) + rand(-.03, .03);
      bullet(a, rand(1050, 1200), isSuper ? 430 : t.range, isSuper ? 360 : t.dmg, isSuper ? 9 : 7,
        isSuper ? { breakWalls: true, knock: 140, color: '#ffd23c' } : null);
    }
    sfx(isSuper ? 'super' : 'shot', e.x, e.y);
  } else if (t.attack === 'sniper') {
    if (isSuper) {
      for (let i = -1; i <= 1; i++) bullet(ang + i * .09, 1500, 820, 1000, 12, { pierce: true, hits: new Set(), color: '#ffd23c' });
      sfx('super', e.x, e.y);
    } else { bullet(ang, 1550, t.range, t.dmg, 9); sfx('snipe', e.x, e.y); }
  } else {
    const d = clamp(frac, .15, 1) * (isSuper ? t.range * 1.05 : t.range);
    let tx = clamp(e.x + Math.cos(ang) * d, 20, WW - 20), ty = clamp(e.y + Math.sin(ang) * d, 20, WH - 20);
    G.bombs.push({ x0: ox, y0: oy, x1: tx, y1: ty, t: 0, dur: isSuper ? .85 : .6, rad: isSuper ? 170 : 85,
      dmg: (isSuper ? 1700 : t.dmg) * mult, owner: e, breakWalls: isSuper, sup: isSuper });
    sfx(isSuper ? 'super' : 'throw', e.x, e.y);
  }
  return true;
}
function hurt(target, dmg, src, kx, ky) {
  if (target.dead) return;
  target.hp -= dmg; target.flash = .12;
  if (target.kind === 'brawler') { target.lastHurt = G.t; target.reveal = Math.max(target.reveal, .4); }
  G.pops.push({ x: target.x + rand(-10, 10), y: target.y - 50, text: String(Math.round(dmg)), life: .8,
    color: target === G.player ? '#ff4f6d' : (src === G.player ? '#ffffff' : '#ffe3a0') });
  if (src && src.kind === 'brawler' && !src.dead && src !== target)
    src.superCh = Math.min(1, src.superCh + dmg / (TYPES[src.type].superNeed * (target.kind === 'box' ? 2.5 : 1)));
  if (kx || ky) { target.x += kx; target.y += ky; if (target.kind === 'brawler') collideWalls(target); }
  if (target === G.player || src === G.player) sfx('hit', target.x, target.y);
  burst(target.x, target.y, target.kind === 'box' ? '#c98a4b' : '#ffffff', 5, 160);
  if (target.hp <= 0) kill(target, src);
}
function dropCube(x, y) {
  const a = rand(0, TAU), d = rand(0, 40);
  G.cubes.push({ x: clamp(x + Math.cos(a) * d, 30, WW - 30), y: clamp(y + Math.sin(a) * d, 30, WH - 30), t: rand(0, 6) });
}
function kill(target, src) {
  target.dead = true; target.hp = 0;
  if (target.kind === 'box') {
    dropCube(target.x, target.y);
    burst(target.x, target.y, '#c98a4b', 18, 300);
    sfx('break', target.x, target.y);
    return;
  }

function collideWalls(e) {

// ---------- Boty ----------
function botUpdate(b, dt) {

  if (ai.think <= 0) {
    ai.think = rand(.15, .3);
    let best = null, bd = 950;
    for (const o of G.brawlers) {
      if (o === b || o.dead || hiddenFrom(o, b)) continue;
      const d = dist(o, b);
      const score = d - (o.hp / o.maxHp < .4 ? 120 : 0);
      if (score < bd) { bd = score; best = o; }
    }
    ai.target = best;
    ai.box = null; ai.cube = null;
    if (!best) {
      let cd = 650;
      for (const c of G.cubes) { const d = dist(c, b); if (d < cd) { cd = d; ai.cube = c; } }
      if (!ai.cube) {
        let bd2 = 900;
        for (const x of G.boxes) { if (x.dead) continue; const d = dist(x, b); if (d < bd2) { bd2 = d; ai.box = x; } }
      }
    }
  }

    else if (d > desired + 40) goalAng = a + ai.strafe * .35;
    else if (d < desired - 70) goalAng = a + Math.PI - ai.strafe * .4;
    else { goalAng = a + ai.strafe * Math.PI / 2; speedMul = .8; }

    }

    goalAng = Math.atan2(ai.cube.y - b.y, ai.cube.x - b.x);

    }

    if (!ai.goal || ai.goalT <= 0 || Math.hypot(ai.goal.x - b.x, ai.goal.y - b.y) < 60) {
      const a = rand(0, TAU), r = rand(0, Math.max(120, G.gasR * .55));
      ai.goal = { x: clamp(cX + Math.cos(a) * r, 80, WW - 80), y: clamp(cY + Math.sin(a) * r, 80, WH - 80) };
      ai.goalT = rand(3, 6);
    }
    goalAng = Math.atan2(ai.goal.y - b.y, ai.goal.x - b.x);
    speedMul = .85;
  }
  if (inDanger) { goalAng = Math.atan2(cY - b.y, cX - b.x); speedMul = 1; }

// ---------- Aktualizacja ----------
function update(dt) {
  G.t += dt;
  const startShrink = 16, shrinkDur = 95, maxR = Math.hypot(WW, WH) / 2 + 60, minR = 240;
  G.gasR = maxR + (minR - maxR) * clamp((G.t - startShrink) / shrinkDur, 0, 1);
  if (!G.demo && G.t - dt < startShrink && G.t >= startShrink) G.banner = { text: 'Trujący gaz nadciąga!', t: 2.4 };
  if (G.banner) { G.banner.t -= dt; if (G.banner.t <= 0) G.banner = null; }

  for (const b of G.brawlers) {
    if (b.dead) continue;
    const t = TYPES[b.type];
    if (b.isPlayer) playerUpdate(b, dt); else botUpdate(b, dt);
    moveEntity(b, dt);
    b.ammo = Math.min(3, b.ammo + dt / t.reload);
    if (G.t - b.lastHurt > 3 && G.t - b.lastShot > 3 && b.hp < b.maxHp) b.hp = Math.min(b.maxHp, b.hp + b.maxHp * .13 * dt);
    b.reveal -= dt; b.flash -= dt; b.kick = Math.max(0, b.kick - dt * 6);
    b.inBush = bushAt(b.x, b.y);
    if (Math.hypot(b.x - WW / 2, b.y - WH / 2) > G.gasR) {
      b.gasAcc += dt;
      if (b.gasAcc >= .8) { b.gasAcc = 0; hurt(b, 1000, null); if (b.dead) continue; }
    } else b.gasAcc = Math.min(b.gasAcc, .5);
    for (let i = G.cubes.length - 1; i >= 0; i--) {
      const c = G.cubes[i];
      if (Math.hypot(c.x - b.x, c.y - b.y) < b.r + 18) {
        G.cubes.splice(i, 1); b.cubes++;
        b.maxHp += t.hp * .1; b.hp += t.hp * .1;
        G.pops.push({ x: b.x, y: b.y - 60, text: '+1 MOC', life: 1, color: '#7dff9a' });
        if (b.isPlayer) sfx('pick');
      }
    }
  }
  // brawlerzy rozpychają się delikatnie
  const al = alive();
  for (let i = 0; i < al.length; i++) for (let j = i + 1; j < al.length; j++) {
    const a = al[i], c = al[j], dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy), m = a.r + c.r;

      }

      burst(b.x1, b.y1, '#ffb347', b.sup ? 40 : 18, b.sup ? 420 : 260);
      burst(b.x1, b.y1, '#5a4a6a', 10, 160);
      if (Math.hypot(b.x1 - cam.x, b.y1 - cam.y) < 600) cam.shake = Math.max(cam.shake, b.sup ? 12 : 5);

  }
  for (let i = G.rings.length - 1; i >= 0; i--) { const r = G.rings[i]; r.life -= dt; r.r += (r.max - r.r) * Math.min(1, dt * 14); if (r.life <= 0) G.rings.splice(i, 1); }

  for (const c of G.cubes) c.t += dt;

  if (G.over && G.t >= G.endAt && state === 'play') showEnd();
  if (G.demo && alive().length <= 1 && !G.endAt) G.endAt = G.t + 2;
  if (G.demo && G.endAt && G.t > G.endAt) newMatch(null);
}

    const g = c.getContext('2d'); g.scale(2, 2); drawBrawler(g, 46, 50, 26, k, .5, {});
    b.appendChild(c);
    b.insertAdjacentHTML('beforeend', '<h3>' + t.name + '</h3><span class="role">' + t.role + '</span><p>' + t.desc + '</p>' +
      '<div class="bars"><span>Życie</span><span class="bar"><i style="width:' + t.stat.hp * 100 + '%"></i></span>' +
      '<span>Zasięg</span><span class="bar"><i style="width:' + t.stat.rng * 100 + '%"></i></span>' +
      '<span>Siła</span><span class="bar"><i style="width:' + t.stat.dmg * 100 + '%"></i></span></div>');
    b.addEventListener('click', () => { chosen = k; store.set('type', k); buildCards(); });
    box.appendChild(b);
  }
}
function startGame() {
  ensureAudio();
  const el = document.documentElement;
  if (el.requestFullscreen && !document.fullscreenElement && matchMedia('(pointer: coarse)').matches) {
    el.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  }
  for (const k of ['move', 'aim', 'sup']) input[k].active = false;
  newMatch(chosen);
  state = 'play';
  menu.hidden = true; end.hidden = true;
}
function showEnd() {
  state = 'end';
  const p = G.player, r = G.rank || alive().length;
  const rn = document.getElementById('rankNum');
  rn.textContent = '#' + r; rn.className = 'rank' + (r === 1 ? ' win' : '');
  document.getElementById('verdict').textContent = r === 1 ? 'Zwycięstwo! Ostatni na arenie.' : r <= 3 ? 'Blisko! Miejsce na podium.' : 'Pokonany. Spróbuj jeszcze raz!';
  document.getElementById('stKills').textContent = p.kills;
  document.getElementById('stCubes').textContent = p.cubes;
  const s = Math.floor(G.t);
  document.getElementById('stTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const best = store.get('best', 0);
  if (!best || r < best) store.set('best', r);
  end.hidden = false;
}
document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('menuBtn').addEventListener('click', () => { end.hidden = true; menu.hidden = false; state = 'menu'; newMatch(null); updateBest(); });
function updateBest() {
  const best = store.get('best', 0), el = document.getElementById('bestLine');
  const base = '<b>Lewy kciuk</b> – ruch · <b>prawy kciuk</b> – przeciągnij i puść, by strzelić (stuknięcie = auto-celowanie) · <b>żółty przycisk</b> – super';
  el.innerHTML = (best ? 'Najlepszy wynik: <b>#' + best + '</b> · ' : '') + base +
    (matchMedia('(pointer: fine)').matches ? ' · Komputer: <b>WASD</b>, <b>klik</b>, <b>spacja</b>' : '');
}
buildCards(); updateBest();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(buildCards);
document.addEventListener('visibilitychange', () => { paused = document.hidden; last = performance.now(); });

newMatch(null);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const portrait = H > W && matchMedia('(pointer: coarse)').matches;
  if (!paused && !portrait && state !== 'end') update(dt);
  else if (state === 'end' && G) update(dt * .25);
  render();
}
requestAnimationFrame(frame);
})();
</script>
